name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  windows-check:
    name: Windows Node checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm test

  macos-launcher:
    name: macOS launcher
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run app:prepare:macos
      - name: Build the unsigned universal app bundle
        run: >-
          npm run tauri -- build
          --target universal-apple-darwin
          --bundles app
          --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: test -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Taskboard.app"
      - name: Verify packaged taskctl and inherited listener
        run: >-
          npm run app:verify-packaged-taskctl --
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Taskboard.app"
      - name: Verify secretless App, updater, and DMG preflight
        run: >-
          npm run app:preflight --
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Taskboard.app"

  windows-launcher-check:
    name: Windows launcher compile
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - run: npm ci
      - name: Prepare and verify the Windows Node sidecar
        shell: pwsh
        run: |
          npm run app:prepare:windows
          $version = & .\src-tauri\binaries\node-x86_64-pc-windows-msvc.exe --version
          if ($version -ne "v22.23.2") {
            throw "Unexpected Windows Node sidecar version: $version"
          }
          npm run app:verify:windows-resources
      - name: Verify the Windows taskctl wrapper
        shell: pwsh
        run: .\test\windows-taskctl-wrapper.ps1 -ProjectRoot .
      - name: Run the Windows process lifecycle matrix
        run: >-
          node --test
          test/process-lifecycle-matrix.test.mjs
          test/process-tree.test.mjs
          test/taskboard-supervisor.test.mjs
      - name: Run the Windows launcher lifecycle tests
        shell: pwsh
        run: .\test\windows-rust-tests.ps1 -ProjectRoot .
      - name: Check the Windows launcher target
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build the real unsigned NSIS bundle
        run: npm run app:build:windows
      - name: Verify unsigned NSIS install, payload and uninstall
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem `
            .\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe)
          if ($setups.Count -ne 1) {
            throw "Expected one unsigned NSIS setup, found $($setups.Count)"
          }
          $version = node -p "require('./package.json').version"
          try {
            .\scripts\verify-windows-nsis-bundle.ps1 `
              -SetupPath $setups[0].FullName `
              -ExpectedVersion $version `
              -EvidencePath .\src-tauri\target\windows-nsis-evidence.json
          } catch {
            $message = $_.Exception.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error file=scripts/verify-windows-nsis-bundle.ps1,title=Windows NSIS verification failed::$message"
            throw
          }
          Get-Content .\src-tauri\target\windows-nsis-evidence.json
